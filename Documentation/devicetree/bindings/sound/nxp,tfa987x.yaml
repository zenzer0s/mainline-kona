%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/nxp,tfa987x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP/Goodix TFA987X (TFA1) Audio Amplifiers

maintainers:
  - Stephan Gerhold <stephan@gerhold.net>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    enum:
      - nxp,tfa9872
      - nxp,tfa9873
      - nxp,tfa9874

  reg:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

  reset-gpios:
    description: optional reset GPIO.

  sound-name-prefix: true

  vddd-supply:
    description: regulator phandle for the VDDD power supply.

required:
  - compatible
  - reg
  - '#sound-dai-cells'

additionalProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      audio-codec@34 {
        compatible = "nxp,tfa9872";
        reg = <0x34>;
        sound-name-prefix = "Speaker Left";
        #sound-dai-cells = <0>;
      };
      audio-codec@36 {
        compatible = "nxp,tfa9872";
        reg = <0x36>;
        sound-name-prefix = "Speaker Right";
        #sound-dai-cells = <0>;
      };
    };

  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      top_spkr: audio-codec@34 {
        compatible = "nxp,tfa9874";
        reg = <0x34>;
        reset-gpios = <&tlmm 91 GPIO_ACTIVE_HIGH>;
        vddd-supply = <&vreg_s4a_1p8>;
        sound-channel = <0>;
        sound-name-prefix = "Top Speaker";
        #sound-dai-cells = <0>;
      };

      bottom_spkr: audio-codec@35 {
        compatible = "nxp,tfa9874";
        reg = <0x35>;
        reset-gpios = <&tlmm 99 GPIO_ACTIVE_HIGH>;
        vddd-supply = <&vreg_s4a_1p8>;
        sound-channel = <1>;
        sound-name-prefix = "Bottom Speaker";
        #sound-dai-cells = <0>;
      };
    };
