%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/syna,s3908.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synaptics TCM Oncell S3908 I2C touchscreen

maintainers:
  - Casey Connolly <kcxt@postmarketos.org>

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    enum:
      - syna,s3908

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Reset GPIO the chip is connected to.

  vdd-supply:
    description: a phandle for the regulator supplying 3V power.

  vcc-supply:
    description: a phandle for the regulator supplying IO power.

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - vdd-supply
  - vcc-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/gpio/gpio.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      touchscreen@4b {
        compatible = "syna,s3908";
        reg = <0x4B>;

        interrupts-extended = <&tlmm 39 IRQ_TYPE_LEVEL_LOW>;

        reset-gpios = <&tlmm 38 GPIO_ACTIVE_LOW>;

        vdd-supply = <&vreg_l13a_ts_3p0>;
        vcc-supply = <&vreg_l1c_1p8>;
      };
    };
